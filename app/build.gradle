plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Addon base URL + admin token + (optional) broker creds from a gitignored app/secrets.properties.
def secrets = new Properties()
def secretsFile = rootProject.file("app/secrets.properties")
if (secretsFile.exists()) { secretsFile.withInputStream { secrets.load(it) } }
def sv = { String k, String d -> (secrets.getProperty(k) ?: d) }

android {
    namespace 'dev.ajithv.triptracker'
    compileSdk 34

    defaultConfig {
        applicationId "dev.ajithv.triptracker"
        minSdk 27
        targetSdk 34
        versionCode 51
        versionName "r51"

        ndk { abiFilters 'arm64-v8a' }

        buildConfigField "String", "DEF_BASE_URL",  "\"${sv('tt_base_url', 'http://172.20.1.100:8099')}\""
        buildConfigField "String", "DEF_APP_TOKEN", "\"${sv('tt_app_token', '')}\""

        // Google Maps SDK key — drop `tt_maps_key=...` into app/secrets.properties, then rebuild.
        // Empty is fine to ship: Google basemaps stay blank until a valid key is present (no crash).
        manifestPlaceholders = [MAPS_API_KEY: sv('tt_maps_key', 'MISSING_MAPS_KEY')]
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }
    packaging {
        resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "org.maplibre.gl:android-sdk:11.5.2"
    implementation "org.maplibre.gl:android-plugin-annotation-v9:3.0.1"
    implementation "com.google.android.gms:play-services-maps:18.2.0"
}
